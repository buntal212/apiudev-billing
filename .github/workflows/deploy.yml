name: API UDEV Billing Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apiudev-billing-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify HOMELAB Runner
    runs-on:
      - self-hosted
      - linux
      - apiudev-production

    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify server
        run: |
          set -e
          echo "=== SERVER ==="
          hostname
          whoami
          pwd

          echo "=== PHP ==="
          php -v

          echo "=== COMPOSER ==="
          composer --version

          echo "=== LARAVEL ==="
          test -f artisan
          test -f composer.json
          echo "Laravel source detected"

          echo "=== DEPLOY DIRECTORY ==="
          test -d /www/wwwroot/apiudev-billing
          test -w /www/wwwroot/apiudev-billing
          echo "Deployment directory writable"

      - name: Verify success
        run: |
          echo "GitHub Actions Runner HOMELAB ready!"
          echo "No production files were modified."
