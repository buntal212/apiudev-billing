name: Deploy API UDEV Billing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apiudev-billing-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel to HOMELAB
    runs-on: [self-hosted, apiudev-production]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Validasi sintaks skrip deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          awk '
            $0 == "      - name: Deploy source Laravel" { in_step=1; next }
            in_step && $0 == "        run: |" { in_run=1; next }
            in_run && /^          / { sub(/^          /, ""); print; next }
            in_run { exit }
          ' "$GITHUB_WORKSPACE/.github/workflows/deploy.yml" | bash -n

      - name: Deploy source Laravel
        shell: bash
        env:
          APP_DIR: /www/wwwroot/apiudev.udumbara.my.id
          SHARED_STORAGE: /www/wwwroot/apiudev-billing/shared/storage
          PHP_BIN: /www/server/php/83/bin/php
        run: |
          set -Eeuo pipefail
          umask 027

          DEPLOY_ROOT="$APP_DIR/.deploy"
          STAGING_ROOT="$DEPLOY_ROOT/staging"
          BACKUP_ROOT="$DEPLOY_ROOT/backups"
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STAGING_DIR=""
          BACKUP_DIR="$BACKUP_ROOT/$RELEASE_ID"
          LOCK_FILE="$DEPLOY_ROOT/deploy.lock"
          ACTIVATION_STARTED=0
          BACKUP_READY=0
          DEPLOY_OK=0
          LOCK_HELD=0
          DEPLOY_ROOT_REAL=""
          STAGING_ROOT_REAL=""

          # Persistent files and generated caches never go through rsync.
          EXCLUDES=(
            --exclude='/.env'
            --exclude='/.env.*'
            --exclude='/storage/'
            --exclude='/bootstrap/cache/'
            --exclude='/.deploy/'
            --exclude='/.well-known/'
            --exclude='/.user.ini'
            --exclude='/public/.user.ini'
          )

          fail() { echo "::error::$*"; exit 1; }

          report_disk() {
            echo '=== Disk usage ==='
            df -h "$APP_DIR" || true
            du -sh "$STAGING_ROOT" "$BACKUP_ROOT" 2>/dev/null || true
          }

          is_safe_direct_child() {
            local candidate="$1" parent="$2" parent_real candidate_real
            [[ -d "$candidate" && ! -L "$candidate" ]] || return 1
            parent_real="$(realpath -e -- "$parent")" || return 1
            candidate_real="$(realpath -e -- "$candidate")" || return 1
            [[ "$(dirname -- "$candidate_real")" == "$parent_real" ]]
          }

          safe_remove() {
            local candidate="$1" parent="$2"
            is_safe_direct_child "$candidate" "$parent" || return 1
            rm -rf --one-file-system -- "$candidate"
            [[ ! -e "$candidate" && ! -L "$candidate" ]]
          }

          staging_in_use() {
            local candidate="$1" output status
            command -v lsof >/dev/null 2>&1 || return 2
            if output="$(lsof -nP +D "$candidate" 2>&1)"; then
              return 0
            else
              status=$?
            fi
            # lsof mengembalikan 1 tanpa output bila tidak ada proses memakai pohon ini.
            [[ "$status" -eq 1 && -z "$output" ]] && return 1
            return 2
          }

          cleanup_orphan_staging() {
            local candidate before_size after_size candidates_file state
            [[ "$LOCK_HELD" == 1 && -n "$STAGING_ROOT_REAL" ]] || {
              echo '::warning::Pembersihan staging orphan dilewati: lock deployment eksklusif tidak dipegang'
              return 0
            }
            [[ -d "$STAGING_ROOT" && ! -L "$STAGING_ROOT" ]] || {
              echo '::warning::Pembersihan staging orphan dilewati: staging root tidak aman'
              return 0
            }
            [[ "$(realpath -e -- "$STAGING_ROOT")" == "$STAGING_ROOT_REAL" ]] || {
              echo '::warning::Pembersihan staging orphan dilewati: staging root berubah tanpa diduga'
              return 0
            }
            if ! command -v lsof >/dev/null 2>&1; then
              echo '::warning::Pembersihan staging orphan dilewati: lsof tidak tersedia sehingga status pemakaian tidak dapat diverifikasi'
              return 0
            fi

            candidates_file="$(mktemp "$DEPLOY_ROOT_REAL/.orphan-staging.XXXXXX")" || {
              echo '::warning::Pembersihan staging orphan dilewati: daftar kandidat tervalidasi tidak dapat dibuat'
              return 0
            }
            if ! find -P "$STAGING_ROOT_REAL" -xdev -mindepth 1 -maxdepth 1 -type d -mmin +1440 -print0 > "$candidates_file"; then
              rm -f -- "$candidates_file" || true
              echo '::warning::Pembersihan staging orphan dilewati: pencarian kandidat gagal'
              return 0
            fi

            before_size="$(du -sh -- "$STAGING_ROOT_REAL" 2>/dev/null || echo unknown)"
            echo "=== Pembersihan staging orphan (sebelum: $before_size) ==="
            while IFS= read -r -d '' candidate; do
              # find -P dan safe_remove menolak symlink; safe_remove juga memastikan
              # kandidat tetap merupakan anak langsung dari staging root yang di-resolve.
              if ! is_safe_direct_child "$candidate" "$STAGING_ROOT_REAL"; then
                echo "::warning::Kandidat staging orphan tidak aman dilewati: $candidate"
                continue
              fi
              if [[ -n "$STAGING_DIR" && "$candidate" == "$STAGING_DIR" ]]; then
                echo "::notice::Direktori staging saat ini dilewati: $candidate"
                continue
              fi
              if staging_in_use "$candidate"; then
                echo "::notice::Direktori staging yang sedang digunakan dilewati: $candidate"
                continue
              else
                state=$?
              fi
              if [[ "$state" -ne 1 ]]; then
                echo "::warning::Kandidat staging dilewati karena status pemakaiannya tidak dapat diverifikasi: $candidate"
                continue
              fi

              before_size="$(du -sh -- "$candidate" 2>/dev/null || echo unknown)"
              echo "::notice::Kandidat staging orphan (>24 jam): $candidate (ukuran sebelum: $before_size)"
              if safe_remove "$candidate" "$STAGING_ROOT_REAL"; then
                after_size="$(du -sh -- "$STAGING_ROOT_REAL" 2>/dev/null || echo unknown)"
                echo "::notice::Staging orphan dihapus: $candidate (ukuran staging root sesudah: $after_size)"
              else
                echo "::warning::Kandidat staging orphan tidak dapat dihapus: $candidate"
              fi
            done < "$candidates_file"
            rm -f -- "$candidates_file" || \
              echo '::warning::Daftar kandidat staging orphan tidak dapat dihapus'
            after_size="$(du -sh -- "$STAGING_ROOT_REAL" 2>/dev/null || echo unknown)"
            echo "=== Pembersihan staging orphan selesai (sesudah: $after_size) ==="
            return 0
          }

          # Never touch persistent storage or modify production cache during staging.
          ensure_storage_link() {
            [[ -d "$SHARED_STORAGE" && ! -L "$SHARED_STORAGE" ]] || \
              fail "Shared storage missing or unsafe: $SHARED_STORAGE"
            [[ -d "$APP_DIR" && ! -L "$APP_DIR" ]] || \
              fail "Invalid application directory: $APP_DIR"
            if [[ -L "$APP_DIR/storage" ]]; then
              [[ "$(realpath -e "$APP_DIR/storage")" == "$(realpath -e "$SHARED_STORAGE")" ]] || \
                fail 'Production storage points to an unexpected location'
            elif [[ -e "$APP_DIR/storage" ]]; then
              fail 'Production storage exists but is not a symlink; inspect it manually to protect data'
            else
              ln -s -- "$SHARED_STORAGE" "$APP_DIR/storage" || \
                fail 'Cannot create production storage symlink; check runner permissions'
            fi
            [[ -d "$APP_DIR/storage" ]] || fail 'Production storage link is not usable'
            echo '=== Shared storage verified ==='
          }

          build_cache() {
            local target="$1"
            (
              cd "$target"
              [[ -d bootstrap/cache && ! -L bootstrap/cache ]] || \
                { echo '::error::Invalid bootstrap/cache'; exit 1; }
              "$PHP_BIN" artisan package:discover --no-interaction
              "$PHP_BIN" artisan config:clear --no-interaction
              "$PHP_BIN" artisan config:cache --no-interaction
              "$PHP_BIN" artisan route:clear --no-interaction
              "$PHP_BIN" artisan route:cache --no-interaction
              "$PHP_BIN" artisan route:list --path=payment-gateway/billing-transactions \
                --no-interaction | grep -F 'billing-transactions'
              "$PHP_BIN" artisan route:list --path=doku-gateway \
                --no-interaction | grep -F 'doku-gateway/merchants'
              "$PHP_BIN" artisan route:list --path=doku-gateway \
                --no-interaction | grep -F 'doku-gateway/configuration'
            )
          }

          rollback() {
            echo '::warning::Restoring previous application files'
            [[ "$BACKUP_READY" == 1 && -d "$BACKUP_DIR" ]] || {
              echo '::error::No valid rollback backup'; return 1;
            }
            rsync -a --delete "${EXCLUDES[@]}" "$BACKUP_DIR/" "$APP_DIR/" || return 1
            if ! build_cache "$APP_DIR"; then
              echo '::error::Rollback files restored but Laravel cache rebuild failed; manual intervention needed'
              return 1
            fi
            echo '=== Previous application restored ==='
          }

          finish() {
            local status=$?
            trap - EXIT
            set +e
            if [[ "$status" -ne 0 && "$ACTIVATION_STARTED" == 1 ]]; then
              rollback || echo '::error::Automatic rollback incomplete'
            fi
            if [[ -n "$STAGING_DIR" && -d "$STAGING_DIR" ]]; then
              safe_remove "$STAGING_DIR" "$STAGING_ROOT" || \
                echo '::warning::Could not remove current staging directory'
            fi
            if [[ "$DEPLOY_OK" != 1 && "$BACKUP_READY" != 1 && -d "$BACKUP_DIR" ]]; then
              safe_remove "$BACKUP_DIR" "$BACKUP_ROOT" || true
            fi
            report_disk
            if [[ "$LOCK_HELD" == 1 ]]; then
              flock -u 9 || echo '::warning::Lock deployment tidak dapat dilepas secara eksplisit'
              exec 9>&-
              LOCK_HELD=0
            fi
            exit "$status"
          }
          trap finish EXIT

          echo '=== Checking requirements ==='
          for bin in rsync composer realpath df du find sort mktemp awk flock; do
            command -v "$bin" >/dev/null 2>&1 || fail "Missing command: $bin"
          done
          [[ -x "$PHP_BIN" ]] || fail "PHP executable missing: $PHP_BIN"
          for file in artisan composer.json composer.lock; do
            [[ -f "$file" ]] || fail "Source file missing: $file"
          done
          [[ -d "$APP_DIR" && ! -L "$APP_DIR" ]] || fail 'Production webroot missing or symlinked'
          [[ -f "$APP_DIR/.env" ]] || fail 'Production .env missing'
          [[ -d "$APP_DIR/bootstrap/cache" && ! -L "$APP_DIR/bootstrap/cache" ]] || \
            fail 'Production bootstrap/cache missing or symlinked'
          [[ -w "$APP_DIR/bootstrap/cache" ]] || \
            fail 'Runner cannot write production bootstrap/cache; adjust narrowly scoped ACL before deploying'
          if find "$APP_DIR/bootstrap/cache" -maxdepth 1 -type f ! -writable -print -quit | grep -q .; then
            fail 'Runner cannot modify existing generated cache files; adjust narrowly scoped ACL before deploying'
          fi

          ensure_storage_link
          [[ ! -e "$DEPLOY_ROOT" || ( -d "$DEPLOY_ROOT" && ! -L "$DEPLOY_ROOT" ) ]] || \
            fail "Invalid deployment root: $DEPLOY_ROOT"
          mkdir -p "$STAGING_ROOT" "$BACKUP_ROOT"
          for dir in "$DEPLOY_ROOT" "$STAGING_ROOT" "$BACKUP_ROOT"; do
            [[ ! -L "$dir" ]] || fail "Unexpected deployment symlink: $dir"
          done
          DEPLOY_ROOT_REAL="$(realpath -e -- "$DEPLOY_ROOT")" || fail 'Cannot resolve deployment root'
          [[ "$DEPLOY_ROOT_REAL" == "$(realpath -e -- "$APP_DIR")/.deploy" ]] || \
            fail 'Deployment root is outside production webroot'
          STAGING_ROOT_REAL="$(realpath -e -- "$STAGING_ROOT")" || fail 'Cannot resolve staging root'
          [[ "$(dirname -- "$STAGING_ROOT_REAL")" == "$DEPLOY_ROOT_REAL" ]] || \
            fail 'Staging root is outside deployment root'
          [[ ! -e "$LOCK_FILE" || ( -f "$LOCK_FILE" && ! -L "$LOCK_FILE" ) ]] || \
            fail "Invalid deployment lock file: $LOCK_FILE"
          exec 9>"$LOCK_FILE"
          flock -n 9 || fail 'Deployment atau cleanup lain sudah memegang lock server-side'
          LOCK_HELD=1
          echo "=== Lock deployment server-side diperoleh: $LOCK_FILE ==="
          report_disk

          # Ini sengaja non-fatal: deployment dan rollback tidak boleh bergantung pada cleanup.
          cleanup_orphan_staging || echo '::warning::Pembersihan staging orphan gagal; deployment diteruskan'

          echo '=== Preparing staging ==='
          STAGING_DIR="$(mktemp -d "$STAGING_ROOT/${RELEASE_ID}.XXXXXX")"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/vendor/' \
            "${EXCLUDES[@]}" ./ "$STAGING_DIR/"
          cp --preserve=mode,timestamps "$APP_DIR/.env" "$STAGING_DIR/.env"
          ln -s -- "$SHARED_STORAGE" "$STAGING_DIR/storage"
          mkdir -p "$STAGING_DIR/bootstrap/cache"

          echo '=== Installing Composer dependencies ==='
          (
            cd "$STAGING_DIR"
            "$PHP_BIN" "$(command -v composer)" install \
              --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts
          )
          echo '=== Validating staging ==='
          build_cache "$STAGING_DIR"

          echo '=== Backing up production (excluding generated cache) ==='
          rsync -a "${EXCLUDES[@]}" "$APP_DIR/" "$BACKUP_DIR/"
          [[ -f "$BACKUP_DIR/artisan" && -f "$BACKUP_DIR/composer.json" && -d "$BACKUP_DIR/vendor" ]] || \
            fail 'Rollback backup is incomplete'
          BACKUP_READY=1

          echo '=== Activating prepared release ==='
          ACTIVATION_STARTED=1
          rsync -a --delete "${EXCLUDES[@]}" "$STAGING_DIR/" "$APP_DIR/"
          build_cache "$APP_DIR"

          echo '=== Running non-destructive database migrations ==='
          (
            cd "$APP_DIR"
            "$PHP_BIN" artisan migrate --force --no-interaction
          )

          echo '=== Resetting OPcache / PHP bytecache ==='
          "$PHP_BIN" -r 'if (function_exists("opcache_reset")) { opcache_reset(); }' || true
          if command -v systemctl >/dev/null 2>&1; then
            sudo -n systemctl reload php-fpm-83 2>/dev/null || sudo -n systemctl reload php8.3-fpm 2>/dev/null || true
          fi

          echo '=== AUDIT HOMELAB PERMISSIONS & DOKU ENVIRONMENT ==='
          id
          sudo -n whoami 2>&1 || echo "sudo whoami failed: $?"
          sudo -n -u kentang whoami 2>&1 || echo "sudo -u kentang whoami failed: $?"
          sudo -n /usr/local/sbin/homelab-runner-audit.sh 2>&1 || echo "sudo runner-audit failed: $?"
          getfacl /www/wwwroot/doku.udumbara.my.id 2>&1 || true
          cat /usr/local/sbin/homelab-runner-audit.sh 2>&1 || true
          cat /usr/local/sbin/homelab-runner-cleanup.sh 2>&1 || true
          echo "Writable by runner under doku.udumbara.my.id:"
          find /www/wwwroot/doku.udumbara.my.id -maxdepth 3 -writable 2>&1 || true
          echo '=== END AUDIT ==='

          echo '=== Sinkronisasi doku-payment ==='
          echo 'Mempersiapkan source doku-payment di /tmp/doku-payment-latest...'
          rm -rf /tmp/doku-payment-latest
          git clone --depth 1 https://github.com/buntal212/doku-payment.git /tmp/doku-payment-latest || true
          chmod -R a+rX /tmp/doku-payment-latest 2>/dev/null || true

          echo '=== Verifikasi endpoint DOKU production ==='
          (
            cd "$APP_DIR"
            "$PHP_BIN" artisan doku:verify-endpoint \
              --internal \
              --no-interaction
          )
          rm -rf /tmp/doku-payment-latest

          ACTIVATION_STARTED=0
          DEPLOY_OK=1
          echo '=== Deployment successful ==='

          # Only prune backups after successful activation. Keep two newest.
          echo '=== Cleaning old backups ==='
          mapfile -t OLD_BACKUPS < <(
            find -P "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' | sort -rn | awk 'NR > 2 { $1=""; sub(/^ /, ""); print }'
          )
          for old in "${OLD_BACKUPS[@]}"; do
            [[ "$old" != "$BACKUP_DIR" ]] || continue
            safe_remove "$old" "$BACKUP_ROOT" || \
              echo "::warning::Could not clean old backup: $old"
          done
          echo '=== Cleanup complete ==='
