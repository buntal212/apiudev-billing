name: Deploy API UDEV Billing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apiudev-billing-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel to HOMELAB
    runs-on: [self-hosted, apiudev-production]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy source Laravel
        shell: bash
        env:
          APP_DIR: /www/wwwroot/apiudev.udumbara.my.id
          PHP_BIN: /www/server/php/83/bin/php
        run: |
          set -euo pipefail

          echo "=== Checking requirements ==="
          test -f artisan
          test -f composer.json
          test -f composer.lock

          command -v rsync
          command -v composer
          test -x "$PHP_BIN"

          echo "=== Synchronizing source ==="

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            ./ "$APP_DIR/"

          cd "$APP_DIR"

          echo "=== Installing Composer dependencies ==="

          "$PHP_BIN" "$(command -v composer)" install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader \
            --no-scripts

          echo "=== Preparing Laravel storage ==="

          mkdir -p \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

          echo "=== Checking application environment ==="

          if [ -f .env ]; then
            echo "Production .env found."
          else
            echo "Production .env not created yet."
            echo "Laravel initialization will be completed later."
          fi

          echo "=== Source deployment successful ==="
