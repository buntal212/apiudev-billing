name: apiudev-billing

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        restart: unless-stopped
        networks:
            - udev-network

    nginx:
        image: nginx:alpine
        ports:
            - "127.0.0.1:8001:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        restart: unless-stopped
        networks:
            - udev-network

networks:
    udev-network:
        driver: bridge
